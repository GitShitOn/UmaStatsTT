# Pubblica la webapp (cartella web/) su GitHub Pages.
# Una volta sola: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pubblica la webapp su GitHub Pages

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # solo dal branch predefinito del repository, qualunque sia il suo nome
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
